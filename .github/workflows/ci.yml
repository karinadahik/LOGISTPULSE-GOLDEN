name: LOGISTPULSE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


jobs:
  adr-governance:

    name: ADR governance
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Validate ADR structure
        shell: bash
        run: |

          set -euo pipefail

          mapfile -t ADR_FILES < <(
            find docs/adr \
              -maxdepth 1 \
              -type f \
              -name 'ADR-[0-9][0-9][0-9]-*.md' \
              | sort
          )

          if [ "${#ADR_FILES[@]}" -eq 0 ]; then
            echo "::error::No numbered ADR was found in docs/adr/"
            exit 1
          fi


          for adr in "${ADR_FILES[@]}"; do

            echo "Validating $adr"

            for heading in \
              "## Status" \
              "## Context" \
              "## Decision" \
              "## Data ownership" \
              "## Alternatives considered" \
              "## Consequences" \
              "### Positive" \
              "### Negative" \
              "## Reliability and failure modes" \
              "## Observability evidence" \
              "## Security considerations"
            do

              if ! grep -Fqx "$heading" "$adr"; then

                echo \
                  "::error file=$adr::Missing required section: $heading"

                exit 1

              fi

            done


            if ! grep -Eq '^(Proposed|Accepted|Superseded)$' "$adr"; then

              echo \
                "::error file=$adr::ADR Status must be Proposed, Accepted or Superseded"

              exit 1

            fi

          done


      - name: Require ADR in Pull Request
        if: github.event_name == 'pull_request'
        shell: bash

        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

        run: |

          set -euo pipefail

          echo "Files changed by this Pull Request:"

          git diff \
            --name-only \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            | tee /tmp/changed-files.txt


          if ! grep -Eq \
            '^docs/adr/ADR-[0-9]{3}-.*\.md$' \
            /tmp/changed-files.txt; then

            echo \
              "::error::This Pull Request must add or modify a numbered ADR under docs/adr/"

            exit 1

          fi


          echo "ADR evidence found."

  architecture-contract:

    name: Architecture contract
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Validate required platform assets
        run: |

          echo "Validating LOGISTPULSE architecture..."

          test -f compose.yaml
          test -f .devcontainer/Dockerfile

          test -f observability/compose.yaml
          test -f observability/prometheus.yml

          for service in \
            inventory-api \
            logistics-api \
            operations-api \
            fulfillment-api
          do

            test -f services/$service/app.py

          done

          echo "Architecture contract OK"


      - name: Validate Docker Compose
        run: |

          docker compose config --quiet

          docker compose \
            -f observability/compose.yaml \
            config --quiet

          echo "Compose definitions OK"



  integration:

    name: Build, integration and observability

    runs-on: ubuntu-latest

    needs:
      - architecture-contract
      - adr-governance


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Build LOGISTPULSE
        run: |

          docker compose build


      - name: Start LOGISTPULSE
        run: |

          docker compose up -d

          echo
          echo "Initial container state:"
          docker compose ps


      - name: Platform readiness gate
        run: |

          echo "Waiting for LOGISTPULSE platform readiness..."

          READY=false

          for i in $(seq 1 60); do

            INVENTORY=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/inventory || true)

            LOGISTICS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/logistics || true)

            OPERATIONS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/operations || true)

            FULFILLMENT=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/fulfillment || true)


            echo \
              "Attempt $i/60:" \
              "inventory=$INVENTORY" \
              "logistics=$LOGISTICS" \
              "operations=$OPERATIONS" \
              "fulfillment=$FULFILLMENT"


            if [ "$INVENTORY" = "200" ] && \
               [ "$LOGISTICS" = "200" ] && \
               [ "$OPERATIONS" = "200" ] && \
               [ "$FULFILLMENT" = "200" ]; then

              READY=true

              echo
              echo "LOGISTPULSE PLATFORM READY"

              break

            fi


            sleep 3

          done


          if [ "$READY" != "true" ]; then

            echo
            echo "ERROR: LOGISTPULSE did not become ready"

            docker compose ps -a

            exit 1

          fi


      - name: Domain and regression smoke tests
        run: |

          bash scripts/smoke.sh


      - name: Start observability control plane
        run: |

          docker compose \
            -f observability/compose.yaml \
            up -d prometheus grafana


      - name: Validate Prometheus
        run: |

          echo "Waiting for Prometheus..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://localhost:9090/-/ready \
              > /dev/null 2>&1; then

              echo "Prometheus READY"
              break

            fi

            sleep 2

          done


          curl -fsS \
            http://localhost:9090/-/ready


      - name: Validate Grafana
        run: |

          echo "Waiting for Grafana..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://localhost:3000/api/health \
              > /dev/null 2>&1; then

              echo "Grafana READY"
              break

            fi

            sleep 2

          done


          curl -fsS \
            http://localhost:3000/api/health \
            | grep -q "ok"


      - name: Diagnostic evidence on failure
        if: failure()

        run: |

          echo
          echo "======================================"
          echo " CONTAINER STATUS"
          echo "======================================"

          docker compose ps -a || true


          echo
          echo "======================================"
          echo " APPLICATION LOGS"
          echo "======================================"

          docker compose logs \
            --tail=250 || true


          echo
          echo "======================================"
          echo " OBSERVABILITY LOGS"
          echo "======================================"

          docker compose \
            -f observability/compose.yaml \
            logs --tail=100 || true


      - name: Stop observability
        if: always()

        run: |

          docker compose \
            -f observability/compose.yaml \
            down || true


      - name: Stop LOGISTPULSE
        if: always()

        run: |

          docker compose down -v || true
